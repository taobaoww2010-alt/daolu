name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode version to build'
        required: true
        default: '1.18.2'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-latest
            platform: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd build/opencode
          bun install

      - name: Apply patches
        run: |
          # Clone opencode
          git clone --depth 1 --branch "v${{ github.event.inputs.opencode_version || '1.18.2' }}" \
            https://github.com/anomalyco/opencode.git build/opencode
          
          # Apply patches
          find patches -type f | while read -r patch_file; do
            relative_path="${patch_file#patches/}"
            target_file="build/opencode/$relative_path"
            mkdir -p "$(dirname "$target_file")"
            cp "$patch_file" "$target_file"
          done

      - name: Build
        working-directory: build/opencode
        env:
          OPENCODE_VERSION: ${{ github.event.inputs.opencode_version || '1.18.2' }}
          OPENCODE_CHANNEL: latest
        run: |
          bun install
          bun run packages/opencode/script/build.ts --single

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daolu-${{ matrix.platform }}
          path: build/opencode/packages/opencode/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            daolu-darwin-arm64/bin/opencode
            daolu-darwin-x64/bin/opencode
            daolu-linux-x64/bin/opencode
            daolu-linux-arm64/bin/opencode
          generate_release_notes: true
