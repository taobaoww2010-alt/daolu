name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode version to build'
        required: true
        default: '1.18.2'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            suffix: ""
          - os: macos-13
            platform: darwin-x64
            suffix: ""
          - os: ubuntu-latest
            platform: linux-x64
            suffix: ""
          - os: ubuntu-latest
            platform: linux-arm64
            suffix: ""
          - os: windows-latest
            platform: windows-x64
            suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install setuptools
        if: runner.os != 'Windows'
        run: python3 -m pip install setuptools || pip install setuptools || true

      - name: Apply patches
        shell: bash
        run: |
          # Clone opencode
          git clone --depth 1 --branch "v${{ github.event.inputs.opencode_version || '1.18.2' }}" \
            https://github.com/anomalyco/opencode.git build/opencode || \
          git clone --depth 1 https://github.com/anomalyco/opencode.git build/opencode

          # Apply patches
          find patches -type f | while read -r patch_file; do
            relative_path="${patch_file#patches/}"
            target_file="build/opencode/$relative_path"
            mkdir -p "$(dirname "$target_file")"
            cp "$patch_file" "$target_file"
          done

      - name: Build
        working-directory: build/opencode
        env:
          OPENCODE_VERSION: ${{ github.event.inputs.opencode_version || '1.18.2' }}
          OPENCODE_CHANNEL: latest
        shell: bash
        run: |
          bun install
          bun run packages/opencode/script/build.ts --single --baseline

      - name: Use baseline binary for Linux
        if: runner.os == 'Linux'
        working-directory: build/opencode
        run: |
          # Use baseline binary for better CPU compatibility
          if [ -d "packages/opencode/dist/opencode-linux-x64-baseline" ]; then
            rm -rf packages/opencode/dist/opencode-linux-x64
            mv packages/opencode/dist/opencode-linux-x64-baseline packages/opencode/dist/opencode-linux-x64
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daolu-${{ matrix.platform }}
          path: build/opencode/packages/opencode/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp daolu-darwin-arm64/opencode-darwin-arm64/bin/opencode release-assets/daolu-darwin-arm64
          cp daolu-darwin-x64/opencode-darwin-x64/bin/opencode release-assets/daolu-darwin-x64
          cp daolu-linux-x64/opencode-linux-x64/bin/opencode release-assets/daolu-linux-x64
          cp daolu-linux-arm64/opencode-linux-arm64/bin/opencode release-assets/daolu-linux-arm64
          # Handle both opencode and opencode.exe (Windows)
          win_bin=$(find daolu-windows-x64 -type f \( -name "opencode" -o -name "opencode.exe" \) 2>/dev/null | head -1)
          if [ -n "$win_bin" ]; then
            cp "$win_bin" release-assets/daolu-windows-x64.exe
          fi

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
